name: winbuild

# Windows-only build of Cinnabar. Mirrors the "Package" workflow's windows job, minus the prepare job,
# the macOS/Linux builds, symbol archives, timing reports and all release publishing.
# Output is a downloadable workflow artifact (MSI + setup.exe), and nothing is tagged or released.
# Signing is optional: missing secrets yield unsigned artifacts.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build (blank uses the selected workflow branch)
        type: string
      version:
        description: App version X.Y.Z for artifact names (blank reads it from the source's Cargo metadata)
        type: string

concurrency:
  group: winbuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: source

env:
  UPDATE_TRUSTED_KEYS: ${{ vars.UPDATE_TRUSTED_KEYS }}
  # The build cache saves target/; keep compiler intermediates there, not in the shared build-dir.
  CARGO_BUILD_BUILD_DIR: "{workspace-root}/target"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # These overrides also enable symbols when packaging an older source checkout.
  CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
  CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "packed"
  CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
  CINNABAR_SOURCE_ROOT: ${{ github.workspace }}/source

jobs:
  windows:
    name: Windows x64
    permissions:
      contents: read
      actions: write
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Resolve the app version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION_INPUT" ]]; then
            version="$VERSION_INPUT"
          else
            cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
            version="$(python - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import collections, json, sys
          packages = json.load(open(sys.argv[1], encoding="utf-8"))["packages"]
          for package in packages:
              if package["name"] == "cinnabar":
                  print(package["version"])
                  break
          else:
              print(collections.Counter(p["version"] for p in packages).most_common(1)[0][0])
          PY
            )"
          fi
          echo "::notice::Building app version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Resolve the downloadable artifact name
        run: python "$GITHUB_WORKSPACE/release-tools/packaging/release-downloads.py" env windows x86_64 --version "${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"
      # Restore only: the Package workflow owns saving, so this run stays fast and never writes caches.
      - name: Restore Rust release build cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          lane: release
          store: artifact
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Restore Go build cache
        uses: ./release-tools/.github/actions/build-cache
        with:
          workspace: source
          language: go
          lane: release
          store: artifact
      - name: Install WiX, ImageMagick and make
        shell: pwsh
        run: |
          # The .wxs uses <Files>, which needs WiX 5.
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2
          choco install imagemagick --no-progress -y
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) { choco install make --no-progress -y }
          $magick = Get-ChildItem "$env:ProgramFiles\ImageMagick*" -Directory | Select-Object -First 1
          if (-not $magick) { throw "ImageMagick install directory not found" }
          Add-Content $env:GITHUB_PATH $magick.FullName
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.dotnet\tools"
          Add-Content $env:GITHUB_PATH "$env:ProgramData\chocolatey\bin"
      - name: Package and sign
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          make package-binaries
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/release-tools/packaging/windows/build-installer.ps1" -Root "$CINNABAR_SOURCE_ROOT"
          mv .local/dist/windows-release/Cinnabar-*-x64.msi "$RUNNER_TEMP/$AUXILIARY_ASSET"
          mv .local/dist/windows-release/Cinnabar-*-x64-setup.exe "$RUNNER_TEMP/$RELEASE_ASSET"
      - name: Extract the MSI
        shell: pwsh
        run: |
          $image = Join-Path $env:RUNNER_TEMP "msi-image"
          $msi = Join-Path $env:RUNNER_TEMP $env:AUXILIARY_ASSET
          & "$env:GITHUB_WORKSPACE/release-tools/packaging/windows/extract-msi.ps1" -Msi $msi -Out $image
      - name: Check the MSI against the payload allowlist
        run: bash "$GITHUB_WORKSPACE/release-tools/packaging/check-payload.sh" windows "$(cygpath -u "$RUNNER_TEMP")/msi-image"
      - name: Check the setup embeds the verified MSI
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/release-tools/packaging/windows/check-setup.ps1" -Setup (Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET) `
            -Msi (Join-Path $env:RUNNER_TEMP $env:AUXILIARY_ASSET) -Out "$env:RUNNER_TEMP/setup-image"
      - name: Smoke test the setup engine without installing
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP $env:RELEASE_ASSET
          $layout = Join-Path $env:RUNNER_TEMP "setup-layout"
          $log = Join-Path $env:RUNNER_TEMP "setup-layout.log"
          $process = Start-Process -FilePath $setup -ArgumentList @('/layout', ('"' + $layout + '"'),
            '/quiet', '/norestart', '/log', ('"' + $log + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $log; throw "Setup layout failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            ${{ runner.temp }}/${{ env.AUXILIARY_ASSET }}
            ${{ runner.temp }}/${{ env.RELEASE_ASSET }}
          if-no-files-found: error
          retention-days: 7
