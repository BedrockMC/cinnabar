name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Increment patch (0.0.1), minor (0.1.0), or major (1.0.0)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Require main
        env:
          REQUESTED_REF: ${{ github.ref }}
        run: |
          if [[ "$REQUESTED_REF" != refs/heads/main ]]; then
            echo "::error::Run the release workflow on main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test release increments and Unix installers
        run: |
          python3 scripts/tests/bump_version_test.py
          bash scripts/tests/installers_test.sh
      - name: Prepare the release version and tag
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(python3 scripts/bump-version.py current)"
          tag="v$current"
          recover=false
          if git tag --points-at HEAD | grep -Fxq "$tag"; then
            if draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .draft 2> "$RUNNER_TEMP/release-error")"; then
              [[ "$draft" != true ]] || recover=true
            elif grep -Fq 'HTTP 404' "$RUNNER_TEMP/release-error"; then
              recover=true
            else
              cat "$RUNNER_TEMP/release-error" >&2
              exit 1
            fi
          fi

          if [[ "$recover" == true ]]; then
            echo "Finishing the unpublished $tag release."
          else
            version="$(python3 scripts/bump-version.py "$BUMP")"
            tag="v$version"
            if git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists on another release commit."
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.toml Cargo.lock
            git commit -m "chore: release $tag"
            git tag -a "$tag" -m "Cinnabar $tag"
          fi
          # An atomic push cannot leave a tag behind if main has moved meanwhile.
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    uses: ./.github/workflows/package.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
