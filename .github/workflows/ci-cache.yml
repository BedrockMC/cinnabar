name: CI cache

# Builds what CI compiles and saves it on dev, the base every pull request restores from.
# Pull-request caches are private to that PR, so without this each PR compiled from scratch.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

# Queue rather than cancel: a cancelled run saves nothing.
concurrency:
  group: ci-cache-${{ github.ref }}
  cancel-in-progress: false

# Must match ci.yml: rust-cache keys include CARGO_* variables.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  desktop:
    name: Warm desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          cache-on-failure: true
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libasound2-dev
      - run: cargo build --release -p bedrock-client --locked
      - run: cargo test -p bridge --locked --no-run
      - if: runner.os == 'macOS'
        run: cargo test --workspace --locked --no-run
      - if: runner.os == 'macOS'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-acceptance:
    name: Warm Windows workspace
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-acceptance
          cache-on-failure: true
      - run: cargo test --workspace --locked --no-run
      - continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  verify:
    name: Warm Linux verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          cache-on-failure: true
      - name: Install Linux desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libasound2-dev
      - run: cargo build -p architecture --locked
      - run: cargo test --workspace --locked --no-run
      - continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
