[package]
name = "client-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
arboard = { version = "3", default-features = false }
assets = { path = "../assets" }
bevy = { workspace = true, features = ["bevy_camera", "bevy_window", "keyboard", "mouse", "gamepad", "std"] }
client-world = { path = "../client-world" }
player-state = { path = "../player-state" }
launcher = { path = "../launcher" }
inventory = { path = "../inventory" }
json-ui = { path = "../json-ui" }
protocol = { path = "../protocol" }
render = { path = "../render" }
semantic-input = { path = "../input" }
ui = { path = "../ui" }
world = { path = "../world" }
mod-host = { path = "../mod-host" }
server-experience = { path = "../server-experience" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
rayon.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
resource-pack = { path = "../resource-pack" }

[dev-dependencies]
asset-compiler = { path = "../asset-compiler" }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
